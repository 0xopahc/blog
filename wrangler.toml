# 5tv blog — Worker + static HTML (no build step)
name = "5tv-blog"
main = "cf/worker.js"
compatibility_date = "2024-11-01"

# Only pure static files live here (never node_modules / .git)
[assets]
directory = "./public"
binding = "ASSETS"
# Worker intercepts beacon path; static files served from public/
run_worker_first = ["/cf/log"]
not_found_handling = "404-page"

# Optional Analytics Engine:
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "blog_traffic"
