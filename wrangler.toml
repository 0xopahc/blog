# 5tv blog + canipay.io apex on one Worker
name = "5tv-blog"
main = "cf/worker.js"
compatibility_date = "2024-11-01"
workers_dev = true
preview_urls = true

# Worker routes for apex (zone DNS must be orange-cloud / proxied)
# Custom domains for www + perssy are managed in CF dashboard / API.
routes = [
  { pattern = "canipay.io", zone_name = "canipay.io" },
  { pattern = "canipay.io/*", zone_name = "canipay.io" },
]

# Static blog files
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
