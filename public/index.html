<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5tv</title>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <header class="site-header">
    <p class="mark"><a href="/">5tv</a></p>
    <p class="tagline">notes · lab · builds</p>
    <nav class="site-nav">
      <a href="/" class="active">index</a>
      <a href="#posts">posts</a>
      <a href="/posts/bookshelf.html">bookshelf</a>
    </nav>
  </header>

  <main>
    <section id="posts">
      <h2 class="section-label">posts</h2>
      <ul class="posts" id="post-list"></ul>
      <noscript>
        <ul class="posts">
          <li><a href="/posts/homelab.html"><span>homelab</span><time>2026-07</time></a></li>
          <li><a href="/mdblog/index.html/html"><span>mdblog-dailynotes</span><time>2026-08</time></a></li>
          <li><a href="/posts/canipay.html"><span>canipay</span><time>2026-07</time></a></li>
          <li><a href="/posts/bookshelf.html"><span>bookshelf</span><time>2026-07</time></a></li>
        </ul>
      </noscript>
    </section>
  </main>

  <footer class="site-footer">
    <span id="year"></span>
  </footer>

  <script>
    const POSTS = [
      { title: "homelab", href: "/posts/homelab.html", date: "2026-07" },
      { title: "canipay", href: "/posts/canipay.html", date: "2026-07" },
      { title: "bookshelf", href: "/posts/bookshelf.html", date: "2026-07" },
    ];

    const list = document.getElementById("post-list");
    POSTS.forEach((p) => {
      const li = document.createElement("li");
      li.innerHTML =
        `<a href="${p.href}"><span>${p.title}</span><time datetime="${p.date}">${p.date}</time></a>`;
      list.appendChild(li);
    });

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
  <script src="/cf/logger.js" defer></script>
</body>
</html>
